# data_generator 配置模板
# 用法: ./data_generator -c config.yaml

# S3 节点 ip:port 列表，至少 1 个；多个节点按对象序号 round-robin 分配
endpoints:
  - 10.0.0.1:9000
  - 10.0.0.2:9000

# http 或 https；https 时忽略证书校验（InsecureSkipVerify=true）
scheme: http

# AK/SK
ak: <access-key>
sk: <secret-key>

# 桶名（必须预先存在，启动时 BucketExists 校验失败即中止）
bucket: testbucket

# 对象 key 前缀，所有对象都挂在 prefix/ 下；空字符串表示无前缀
prefix: data/

# 目录树深度/宽度/每目录文件数
# 扇形链结构：每层 l* 桥目录下同层放 files_per_dir 个文件 + (width-1) 个叶子目录 d*
# （最深层 width 个）+ 桥嵌套下一层（非最深层）。
# 总文件数 = (depth + (width-1)*(depth-1) + width) * files_per_dir
#   = depth * files_per_dir（每层 l* 同层文件）
#     + ((width-1)*(depth-1) + width) * files_per_dir（叶子目录文件）
# 例：depth=3 width=4 files_per_dir=10 → (3 + 9 + 4) * 10 = 160 个对象
depth: 3
width: 4
files_per_dir: 10

# 扇形链三个 segment 前缀字符串（可选，默认 l / d / file_）
#   lprefix → 桥目录 segment（默认 "l"，生成 l1/l2/.../lN）
#   dprefix → 叶子目录 segment（默认 "d"，生成 d1/d2/.../dW）
#   fprefix → 文件名前缀（默认 "file_"，生成 file_001/file_002/...）
# 例：lprefix=layer, dprefix=dir, fprefix=obj_ → layer1/layer2/dir1/obj_1
lprefix: l
dprefix: d
fprefix: file_

# 对象大小范围（字节），在 [min, max] 内随机；min==max 即固定
# 上限 100MB（per-object 全内存 buffer）
object_size_min: 1024
object_size_max: 65536

# multipart part size 范围（字节），在 [min, max] 内随机；min==max 即固定
# min 必须 >= 5MiB（S3 最小 part size）；对象 size > partSize 时走 multipart
part_size_min: 5242880
part_size_max: 5242880

# 输出目录（自动创建，run.log append 模式，md5.txt truncate 模式）
output_dir: ./out

# 并发上传数
concurrency: 8

# 进度打印阈值（每 progress_interval 个对象打印一行）
progress_interval: 100

# 本地 MD5 文件名（写到 <output_dir>/<md5_file>，每行 bucket|object|md5hex）
md5_file: md5.txt

# 是否使用 trailer（aws-chunked + x-amz-checksum-sha256 trailer）上传。
# true 时 minio client 开启 TrailingHeaders，每个 PutObject 设 Checksum=SHA256；
# multipart 上传会发 aws-chunked 编码 + chunk-signature + x-amz-checksum-sha256
# trailer——正是 chunked_check_tool 检测的 body 损坏路径。
# 单 PUT（size <= partSize）只在请求头加 x-amz-checksum-sha256，不发 chunked 编码。
# 默认 false（旧行为）。
use_trailer: false

# 手动 multipart 上传：控制每个操作（init / 各 part / complete）发送的 endpoint index。
# 空（默认）→ 走 minio-go 自动 multipart（每对象单节点 round-robin）。
# 非空 → 手动编排 multipart，pattern 长度 = N+2（N = ceil(size/partSize)）：
#   pattern[0]     = NewMultipartUpload (init) 的 endpoint
#   pattern[1..N] = 各 PutObjectPart 的 endpoint
#   pattern[N+1]  = CompleteMultipartUpload 的 endpoint
# 例：2 个节点 [ep0, ep1]，size=15MiB partSize=5MiB → N=3，
#   pattern [0, 0, 1, 0, 1] 表示 init→ep0, p1→ep0, p2→ep1, p3→ep0, complete→ep1。
# 仅当 size > partSize 时才走手动 multipart；size <= partSize 走单 PUT，pattern 忽略。
# 任一步失败 → AbortMultipartUpload (best-effort, pattern[0]) → 返回 err。
# 前置条件：S3 集群必须跨节点共享 multipart upload 状态
# （某节点 init 拿到的 uploadID 在另一节点 PutObjectPart 必须可见可用）。
# use_trailer=true 时 init/complete 的 PutObjectOptions 带 ChecksumSHA256，
# 每个 part 走 aws-chunked + trailer 编码。
multipart_endpoint_pattern: []

