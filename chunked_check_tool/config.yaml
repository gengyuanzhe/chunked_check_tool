# chunked_check_tool 配置模板
# 用法:
#   ./chunked_check_tool -c config.yaml -bkt <bucket> [-prefix <p>] [-nextmarker <key>]
#   ./chunked_check_tool -c config.yaml -bkt <bucket> -check-file <path>   # 重查失败对象（check_failed/mp_check_failed/mismatch）
#   ./chunked_check_tool -c config.yaml -bkt <bucket> -backup-file <path>  # 损坏对象备份（不校验直接中转；需配 backup_bucket）

# S3 节点 ip:port 列表，至少 1 个；多个节点会做故障轮询隔离
endpoints:
  - 10.0.0.1:9000
  - 10.0.0.2:9000

# http 或 https；https 时忽略证书校验（InsecureSkipVerify=true）
scheme: http

# AK/SK
ak: <access-key>
sk: <secret-key>

# 列举模式：1=子目录+平铺 nextmarker, 2=递归 BFS delimiter（默认）
list_type: 2

# ListObjects API 版本：1=V1（marker 分页，默认）, 2=V2（continuation token）
list_api_version: 1

# 列举并发度
list_concurrency: 8

# 校验并发度
check_concurrency: 16

# 输出目录（自动创建，所有文件 append 模式，支持断点续跑）
output_dir: ./out

# 是否在 output_dir 名字后追加 _YYYYMMDD_HHMMSS 后缀（./out → ./out_20260908_175201），
# 每次运行落到独立目录，结果互不混写。默认 true；false=固定使用 output_dir 原样路径。
# 断点续跑场景请显式设为 false，否则每次重启都会进入新目录。
# 该开关同时作用于 backup_output_dir：开启时两个目录使用同一时间戳成对生成
# （./out_<stamp> 与 ./backup_<stamp>）。
output_dir_timestamp: true

# backup-file 模式的输出目录（与 output_dir 分离，避免 list/check 结果与 backup
# 结果混写）。仅 -backup-file 模式使用，其他模式忽略。
# -backup-file 模式必填，不配启动即报错中止；同样受 output_dir_timestamp 控制。
backup_output_dir: ./backup_out

# true=列举+校验；false=仅列举（不校验普通对象，不写对象文件，不创建 owner 目录，仅写 list_failed.*）
is_check: true

# 是否记录正常普通对象到 <ownerID>/ok_objects.txt（-check-file 模式恒记录，不受此项控制）
is_success_log: false

# 多段对象损坏检查模式：
#   0 = 关闭：所有多段对象直接写 mp.txt，不做检查
#   1 = offset 检查：LIST 请求带 internal-list-mp-offset: true header，
#       服务端返回的多段 ETag 为 <md5>-<partcnt>-<off0>|<off1>|... 格式，
#       按真实 part 边界逐段检查；ETag 解析不出 offsets 的对象落 list_parse_failed.txt
#       （根目录，需要人工补 part 边界后再检查）
multipart_check_mode: 0

# 是否记录干净的多段对象到 <ownerID>/ok_mp.txt
# 主扫描里 multipart_check_mode != 0 时生效；-check-file 模式恒记录，不受此项控制
is_multipart_success_log: false

# 节点隔离阈值：进程级累积的节点故障数（连接错误、超时、5xx；4xx 业务错误
# 不计）达到该值才把节点隔离出轮询池。故障计数跨所有 worker 共享、无时间
# 衰减。默认 3（单个瞬时抖动不再烧掉健康节点）；设 1 恢复旧的
# "首次故障即隔离" 行为。无论是否达到阈值，故障后的重试都换到其他节点
# （仅剩单节点时才在原节点重试），真死节点不会造成工作项丢失。
node_isolate_threshold: 3

# 隔离节点恢复探测间隔（秒）。后台每轮对被隔离节点做一次 HEAD bucket 探测，
# 连续 2 次健康应答（任何正常 S3 响应；5xx/传输错误不算）即恢复进轮询池，
# 同时清零该节点的故障计数。适合小时级长跑批：运维中途重启某节点进程后，
# 工具能自动用回恢复的容量。设 0 禁用恢复（隔离在进程生命周期内永久）。
node_recover_probe_interval: 60

# stdout 进度打印阈值（约，性能优先，不要求精确）
progress_interval: 5000

# 每页 LIST 的 MaxKeys。可选，默认 1000，范围 1..1000（S3 wire 上限，超过会被服务端截断）。
# 该值同时是"短响应检测"的基准——服务端返回 IsTruncated=true 但本页条目数
# （对象+公共前缀）少于 max_keys 时打告警（矛盾状态，常预示服务端翻页 bug）。
max_keys: 1000

# LIST 请求是否带 EncodingType=url（默认 false）。开启后服务端把 key/prefix/
# marker 字段在 wire 上 URL 编码——含 \x1f 等 XML 1.0 非法控制字符的 key 不再
# 撕裂整页 XML 反序列化（撕裂 = 整页进 list_failed）。SDK 不会自动解码：
# s3client 出口统一解码回原始形态，工具内部与记录文件均与该配置无关。
# 开启前先在目标服务端探测确认其正确实现了该参数。
encoding_type_url: false

# true=每次 LIST 请求打一行诊断（请求 marker / 响应计数与 next marker /
# 错误）到 run.log，排翻页异常用；false 零成本静默。
debug_log: false

# LIST 时延统计窗口（秒），默认 60。进度行的 latency_avg_ms/latency_max_ms
# 是该窗口内的均值/最大值而非全局均值——长跑中全局均值被早期毛刺稀释，
# 看不出当前批次的服务端健康度。
latency_window_sec: 60

# journal 快照的间隔（秒），默认 600（10 分钟）。list_type=2 扫描每隔这么久把
# 扫描进度写一次 journal.txt；进程被 kill -9 后最多重做一个间隔的进度。
# 调小更安全，但写盘更频繁。负值启动报错。
journal_checkpoint_interval_sec: 600

# lister→checker channel 容量；0 走默认 max(check_concurrency*4, 2000)
obj_ch_capacity: 0

# output writer channel 容量（每个结果/处理文件一个 channel）；0 走默认 1024
output_ch_capacity: 0

# 备份目标桶（-backup-file 模式必填，其他模式忽略）。
# 备份流程：先上传输入列表文件到 backup_bucket 的 .backup_lists/<原名>_<时间戳>.txt，
# 然后逐对象 HEAD 判型（普通/多段），与输入行声明的类型不一致 → mismatch.txt
# （对象在检查后被改写，可喂回 -check-file 重查）；
# 普通对象整对象流式中转上传，多段对象按行内 offset 分段流式中转上传
# （多段边界=原始 part 边界，非末段需 ≥5MB），
# 最后比对目标/源 ETag，不一致记 backup_failed（坏副本保留）。
# 备份不做损坏探测：是否损坏由检查阶段（list+check / -check-file）判定，
# 输入列表里的对象一视同仁直接中转。
# 本地输出：backup_ok.txt / backup_failed.txt / mismatch.txt。
backup_bucket:
