# chunked_check_tool 配置模板
# 用法:
#   ./chunked_check_tool -c config.yaml -bkt <bucket> [-prefix <p>] [-nextmarker <key>]
#   ./chunked_check_tool -c config.yaml -bkt <bucket> -list-file <path>   # 跳过 S3 列举
#   ./chunked_check_tool -c config.yaml -bkt <bucket> -backup-file <path> # 损坏对象备份（需配 backup_bucket）

# S3 节点 ip:port 列表，至少 1 个；多个节点会做故障轮询隔离
endpoints:
  - 10.0.0.1:9000
  - 10.0.0.2:9000

# http 或 https；https 时忽略证书校验（InsecureSkipVerify=true）
scheme: http

# AK/SK
ak: <access-key>
sk: <secret-key>

# 列举模式：1=子目录+平铺 nextmarker, 2=递归 BFS delimiter（默认）, 3=递归+信号量
list_type: 2

# ListObjects API 版本：1=V1（marker 分页，默认）, 2=V2（continuation token）
list_api_version: 1

# 列举并发度
list_concurrency: 8

# 校验并发度
check_concurrency: 16

# 输出目录（自动创建，所有文件 append 模式，支持断点续跑）
output_dir: ./out

# 是否在 output_dir 名字后追加 _YYYYMMDD_HHMMSS 后缀（./out → ./out_20260908_175201），
# 每次运行落到独立目录，结果互不混写。默认 true；false=固定使用 output_dir 原样路径。
# 断点续跑场景请显式设为 false，否则每次重启都会进入新目录。
output_dir_timestamp: true

# true=列举+校验；false=仅列举（不校验普通对象，不写对象文件，不创建 owner 目录，仅写 list_failed.*）
is_check: true

# 是否记录正常普通对象到 <ownerID>/ok_objects.txt
is_success_log: false

# 是否按固定 part size（multipart_segment_size）对多段对象做分段损坏检查。
# 开启后对每个多段对象按 ceil(Size/segment_size) 分段，对每段开头 128 字节做
# Range GET，任一段命中 length;chunk-signature=… 即视为损坏。
# 注意：true 时必须配 multipart_segment_size > 0，否则启动报错中止。
is_multipart_segment_check: false

# 多段分段检查的段长度（字节）。必须与上传时的 multipart part size 一致，
# 否则 chunk-signature 不在段边界上会漏检。0 表示不分段。
multipart_segment_size: 0

# 是否记录干净的多段对象到 <ownerID>/ok_mp.txt（仅 is_multipart_segment_check=true 时生效）
is_multipart_success_log: false

# stdout 进度打印阈值（约，性能优先，不要求精确）
progress_interval: 5000

# lister→checker channel 容量；0 走默认 max(check_concurrency*4, 2000)
obj_ch_capacity: 0

# output writer channel 容量（每个结果/处理文件一个 channel）；0 走默认 1024
output_ch_capacity: 0

# 结果文件每行格式，支持 <bucket>/<key>/<owner> 占位符，其他字符按字面输出。
# 仅影响 per-owner 结果文件（corrupted_objects/mp/corrupted_mp/ok_mp/ok_objects.txt）；
# 处理文件（list_failed/check_failed/mp_check_failed 的 .txt）始终只存 key/prefix。
result_line_format: <bucket>|<key>

# 备份目标桶（-backup-file 模式必填，其他模式忽略）。
# 备份流程：先上传输入列表文件到 backup_bucket 的 .backup_lists/<原名>_<时间戳>.txt，
# 然后逐对象 HEAD 判型（普通/多段），与输入行声明的类型不一致 → mismatch.txt
# （这是备份前的输入类型校验；中转后的 ETag 终验失败走 backup_failed，别混淆）；
# 普通对象直接下载中转上传；多段对象先按行内 offset 做 chunk-signature 校验，
# 命中损坏才按 offsets 分段下载再分段上传（多段边界=原始 part 边界，非末段需 ≥5MB），
# 最后比对目标/源 ETag，不一致记 backup_failed（坏副本保留）。全部干净 → backup_skipped_clean.txt。
# 本地输出：backup_ok.txt / backup_failed.txt / mismatch.txt / backup_skipped_clean.txt。
backup_bucket:
